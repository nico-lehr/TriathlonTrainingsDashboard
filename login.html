<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101010" media="(prefers-color-scheme: dark)">
<!-- iPhone/Android: als App auf dem Home-Bildschirm (Safari: Teilen > Zum Home-Bildschirm) -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TriDashboard">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Anmelden · TriDashboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23101010'/%3E%3Ccircle cx='24' cy='23' r='15' fill='%231baf7a' fill-opacity='0.92'/%3E%3Ccircle cx='40' cy='23' r='15' fill='%232a78d6' fill-opacity='0.92'/%3E%3Ccircle cx='32' cy='41' r='15' fill='%23eb6834' fill-opacity='0.92'/%3E%3C/svg%3E">
<script>
// Manuellen Theme-Wunsch (falls gespeichert) VOR dem ersten Rendern setzen,
// damit die Seite nicht kurz im falschen Theme aufblitzt (wie in index.html).
(function () {
  try {
    var t = localStorage.getItem("triathlon_dashboard_theme_v1");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) { /* localStorage evtl. nicht verfügbar */ }
})();
</script>
<link rel="stylesheet" href="css/variables.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div class="parallax-bg">
  <div class="glow-orb glow-1"></div>
  <div class="glow-orb glow-2"></div>
  <div class="glow-orb glow-3"></div>
</div>
<main class="page login-page">
  <form class="card login-card" id="login-form" novalidate>
    <div class="login-brand" aria-hidden="true"><span></span><span></span><span></span></div>
    <h2 id="login-title">Willkommen zurück</h2>
    <p class="card-sub" id="login-sub">Melde dich an. Jede Person sieht nur ihre eigenen Trainingsdaten.</p>
    <div class="mob-segmented login-mode" id="login-mode" role="tablist" aria-label="Anmelden oder Konto erstellen" hidden>
      <button type="button" role="tab" class="is-on" aria-selected="true" data-mode="login">Anmelden</button>
      <button type="button" role="tab" aria-selected="false" data-mode="register">Konto erstellen</button>
    </div>
    <div class="login-fields">
      <label class="login-field">
        <span>Benutzername</span>
        <input type="text" id="login-username" class="coach-input" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        <small class="login-hint" data-for="register" hidden>3–32 Zeichen: a–z, Ziffern, Punkt, Minus</small>
      </label>
      <label class="login-field">
        <span>Passwort</span>
        <input type="password" id="login-password" class="coach-input" autocomplete="current-password" required>
        <small class="login-hint" data-for="register" hidden>Mindestens 10 Zeichen – z. B. drei Wörter mit einer Zahl</small>
      </label>
      <label class="login-field" data-for="register" hidden>
        <span>Einladungscode</span>
        <input type="text" id="login-code" class="coach-input login-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX">
        <small class="login-hint">Bekommst du von der Person, die das Dashboard betreibt.</small>
      </label>
    </div>
    <label class="login-remember">
      <span>Angemeldet bleiben<small>Auf diesem Gerät nicht erneut anmelden</small></span>
      <input type="checkbox" id="login-remember" class="switch" role="switch" checked>
    </label>
    <p class="login-error" id="login-error" role="alert" hidden></p>
    <button type="submit" class="mob-btn mob-btn-primary login-submit" id="login-submit">Anmelden</button>
  </form>
</main>
<script src="js/data/api-client.js"></script>
<script src="js/login.js"></script>
</body>
</html>
