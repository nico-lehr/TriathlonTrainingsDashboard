# Alle Tests (JavaScript und Server). Laeuft bei jedem Push auf einen
# Arbeitszweig, bei Pull Requests und - ueber release.yml - vor jeder
# Veroeffentlichung: Ist ein Test rot, wird keine neue Version angelegt.
#
#   JavaScript:  node --test tests/js/
#   Server:      python -m unittest discover -s backend -p "test_*.py" -t .
name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JavaScript-Tests
        run: node --test tests/js/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements.txt

      - name: Server-Pakete installieren
        run: python -m pip install -r backend/requirements.txt -r requirements.txt

      - name: Server-Tests
        run: python -m unittest discover -s backend -p "test_*.py" -t .
